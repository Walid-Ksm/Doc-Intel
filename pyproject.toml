[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-intelligence-service"
version = "0.1.0"
description = "A document intelligence microservice for OCR extraction and semantic search"
requires-python = ">=3.10"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Database
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.2.5",

    # Object storage
    "boto3>=1.34",

    # OCR / Document processing
    "docling>=2.0.0",

    # Configuration
    "python-dotenv>=1.0",

    # Vectorization / LangChain pipeline
    "langchain-text-splitters>=0.3",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
    "transformers>=4.40",

    # Task Queue & Broker
    "celery>=5.3.0",
    "redis>=5.0.0",

    # LangGraph & Ollama RAG Orchestration
    "langgraph>=0.2.0",
    "langchain-ollama>=1.0.0",

    # Authentication & JWT Security
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",       # Required by FastAPI TestClient
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: tests that take significant time (e.g. real Docling model inference)",
]
