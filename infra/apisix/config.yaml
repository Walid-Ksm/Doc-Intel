# APISIX Configuration for DocIntelligence Gateway

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: admin
        key: edd1c9f034335f136f87ad84b625c8f1
        role: admin
  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30

apisix:
  node_listen: 9080
  enable_control: true
  control:
    ip: 0.0.0.0
    port: 9092

plugins:
  - cors
  - openid-connect
  - proxy-rewrite
  - response-rewrite
  - prometheus
